{% if cta_link %}
<div style="text-align:center;margin:32px 0 24px;">
    <a href="{{ cta_link }}" style="display:inline-block;padding:12px 28px;background-color:#4f46e5;color:#ffffff;border-radius:6px;text-decoration:none;font-weight:bold;font-size:15px;">
        {{ cta_label|default:"Jetzt ansehen" }}
    </a>
</div>
<p style="margin:16px 0 0;font-size:12px;color:#9ca3af;text-align:center;">
    Falls der Button nicht funktioniert, kopiere diesen Link:<br>
    <a href="{{ cta_link }}" style="color:#4f46e5;word-break:break-all;">{{ cta_link }}</a>
</p>
{% endif %}
